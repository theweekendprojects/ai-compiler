name = "aivm-worker"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
DEFAULT_PROVIDER = "workers-ai"

# Secrets (set via wrangler secret put <NAME>):
# CF_ACCOUNT_ID   — your Cloudflare account ID
# CF_API_TOKEN    — a CF API token with Workers AI read permission
# ANTHROPIC_API_KEY  (optional — for Claude provider)
# AWS_ACCESS_KEY_ID  (optional — for Bedrock/Nova Micro)
# AWS_SECRET_ACCESS_KEY
# CF_GATEWAY_URL     (optional — route via CF AI Gateway)
