name = "aivm-worker"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Secrets (set via: wrangler secret put <NAME>)
# ANTHROPIC_API_KEY
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# CF_GATEWAY_URL  (optional — Cloudflare AI Gateway base URL)

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
